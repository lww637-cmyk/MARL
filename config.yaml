data:
  tickers:
    - "INTC"
    - "AMD"
    - "GS"
    - "CVX"
    - "SBUX"
  start_date: "2018-07-25"
  end_date: "2023-12-15"
  features:
    price:
      - close
      - volume
      - rsi
      - macd
      - bollinger_upper
      - bollinger_lower
    sentiment:
      - sentiment_score
      - sentiment_magnitude

environment:
  episode_length: 252
  initial_capital: 100000
  transaction_cost: 0.001
  n_agents: 2

agents:
  price_agent:
    observation: "price_and_technical"
    learning_rate: 0.0003
    batch_size: 64
    gamma: 0.99
  sentiment_agent:
    observation: "company_specific_sentiment"
    learning_rate: 0.0003
    batch_size: 64
    gamma: 0.99

coordinator:
  model: "gemini-3.8-flash"
  temperature: 0.2
  max_tokens: 2048
  call_frequency: 5 # call LLM every N trading days (weekly cadence)

training:
  total_timesteps: 2000000
  eval_frequency: 10000
  n_eval_episodes: 5
  save_frequency: 100000
  # Suggestion of the OTHER agent while one agent trains (they train separately):
  #   neutral = fixed equal weights on the 5 stocks and cash (default)
  #   random  = a new uniform random allocation every step (old behaviour)
  partner: "neutral"

evaluation:
  metrics:
    - cumulative_return
    - sharpe_ratio
    - max_drawdown
    - volatility
    - win_rate
  baselines:
    - buy_and_hold
    - marl_no_coordinator